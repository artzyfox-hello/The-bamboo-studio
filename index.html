<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bamboo Studio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    header { text-align: center; margin-bottom: 20px; }
    h1 { color: #22c55e; margin: 0 0 6px 0; font-size: 2rem; }
    p { color: #94a3b8; margin: 0; }

    /* Auth Box Styling */
    .auth-container {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }
    .auth-container h2 { margin-top: 0; color: #22c55e; font-size: 1.25rem; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }
    .auth-toggle { font-size: 0.85rem; color: #94a3b8; margin-top: 12px; text-align: center; }
    .auth-toggle span { color: #22c55e; cursor: pointer; text-decoration: underline; }

    /* Video Studio Styling */
    .studio-container {
      display: none; /* Hidden until logged in */
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 640px;
    }
    .user-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: #1e293b;
      padding: 10px 16px;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .video-card {
      position: relative;
      width: 100%;
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    video { width: 100%; height: auto; display: block; }
    .subtitle-box {
      position: absolute;
      bottom: 16px;
      left: 5%;
      right: 5%;
      background: rgba(15, 23, 42, 0.85);
      color: #fef08a;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      min-height: 24px;
    }
    .controls { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      background: #22c55e;
      color: #022c22;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button.secondary { background: #334155; color: #f8fafc; }
    button.danger { background: #ef4444; color: #ffffff; }
  </style>
</head>
<body>

  <header>
    <h1>The Bamboo Studio</h1>
    <p>Virtual Dizi Lessons & Live Subtitles</p>
  </header>

  <!-- Login / Signup Section -->
  <div id="authBox" class="auth-container">
    <h2 id="authTitle">Sign In</h2>
    <form id="authForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" style="width: 100%;" id="authSubmitBtn">Log In</button>
    </form>
    <div class="auth-toggle">
      <span id="toggleAuthMode">Need an account? Sign up</span>
    </div>
  </div>

  <!-- Studio Video Section -->
  <div id="studioBox" class="studio-container">
    <div class="user-bar">
      <span>Welcome, <strong id="userDisplay">Student</strong>!</span>
      <button id="logoutBtn" class="danger" style="padding: 6px 12px; font-size: 12px;">Log Out</button>
    </div>

    <div class="video-card">
      <video id="webcam" autoplay playsinline muted></video>
      <div id="subtitles" class="subtitle-box">Tap "Start Studio" to begin...</div>
    </div>

    <div class="controls">
      <button id="startBtn">Start Camera</button>
      <button id="shareScreenBtn" class="secondary">Share Screen</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
